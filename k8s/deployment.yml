apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: aad-aws-sync
  name: aad-aws-sync
  namespace: $(kubernetes-namespace)
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aad-aws-sync
  template:
    metadata:
      labels:
        app: aad-aws-sync
    spec:
      serviceAccountName: aad-aws-sync
      volumes:
        - name: enterpriseapp-mappings
          secret:
            secretName: "aad-aws-sync-enterpriseapp-mappings"
            items:
              - key: "json"
                path: "enterpriseapp-mappings.json"
      containers:
      - image: dfdsdk/aadawssync:v0.0.31
        name: aad-aws-sync
        imagePullPolicy: Always
        volumeMounts:
          - mountPath: /app/data/enterpriseapp-mappings.json
            subPath: enterpriseapp-mappings.json
            name: enterpriseapp-mappings
        env:
        - name: AAS_SCHEDULER_FREQUENCY
          value: 5m
        - name: AAS_SCHEDULER_JOB_CAPSVC2AAD_ENABLE
          value: "true"
        - name: AAS_SCHEDULER_JOB_CAPSVC2AAD_INTERVAL
          value: "5m"
        - name: AAS_SCHEDULER_JOB_AAD2AWS_ENABLE
          value: "true"
        - name: AAS_SCHEDULER_JOB_AAD2AWS_INTERVAL
          value: "5m"
        - name: AAS_SCHEDULER_JOB_AWSMAPPING_ENABLE
          value: "true"
        - name: AAS_SCHEDULER_JOB_AWSMAPPING_INTERVAL
          value: "5m"
        - name: AAS_SCHEDULER_JOB_AWS2K8S_ENABLE
          value: "true"
        - name: AAS_SCHEDULER_JOB_AWS2K8S_INTERVAL
          value: "5m"
        - name: AAS_SCHEDULER_JOB_CAPABILITYEMAILALIAS_ENABLE
          value: "true"
        - name: AAS_SCHEDULER_JOB_CAPABILITYEMAILALIAS_INTERVAL
          value: "10m"
        - name: AAS_LOG_LEVEL
          value: info
        - name: AAS_AWS_SSOREGION
          value: eu-west-1
        - name: GIN_MODE
          value: release
        - name: AAS_EVENTHANDLING_ENABLED
          value: "true"
        - name: AAS_SCHEDULER_JOB_ASSIGNGROUPS2AZUREENTERPRISEAPPS_ENABLE
          value: "true"
        - name: AAS_SCHEDULER_JOB_ASSIGNGROUPS2AZUREENTERPRISEAPPS_INTERVAL
          value: "5m"
        - name: AAS_HANDLER_ASSIGNGROUPS2AZUREENTERPRISEAPPS_DATAFILEPATH
          value: "/app/data/enterpriseapp-mappings.json"
        # tiUserGroup: maintains the CI_SSU_U - T&I group from the management
        # reporting line under AAS_HANDLER_TIUSERGROUP_ROOTUSERID. Keep ENABLE
        # "false" until ROOTUSERID is set and the app registration has been
        # granted the Graph User.Read.All application permission (required to
        # read directReports); otherwise the job errors on every run.
        - name: AAS_SCHEDULER_JOB_TIUSERGROUP_ENABLE
          value: "true"
        - name: AAS_SCHEDULER_JOB_TIUSERGROUP_INTERVAL
          value: "1h"
        envFrom:
          - secretRef:
              name: aad-aws-sync
              optional: false